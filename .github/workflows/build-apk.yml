name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      # 1. Get your project files
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install system dependencies
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3 \
            python3-pip \
            python3-venv \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential \
            ccache \
            clang

      # 3. Select Java 17
      - name: Set Java 17
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
          echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> "$GITHUB_PATH"

      # 4. Create Python virtual environment
      - name: Create virtual environment
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip setuptools wheel

      # 5. Install Buildozer 1.6.0
      - name: Install Buildozer
        run: |
          . .venv/bin/activate
          python -m pip install buildozer==1.6.0
          buildozer --version

      # 6. Check project files
      - name: Check project
        run: |
          echo "Project files:"
          ls -la

          echo ""
          echo "Buildozer version:"
          . .venv/bin/activate
          buildozer --version

          echo ""
          echo "Java version:"
          java -version

      # 7. Build Android debug APK
      - name: Build APK
        run: |
          . .venv/bin/activate
          buildozer -v android debug

      # 8. Upload APK
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: bin/*.apk
          if-no-files-found: error
